[project]
name = "secondbrain"
version = "0.3.0"
description = "Assistente locale (Ollama) su file, OneDrive/SharePoint sincronizzati, PST Outlook"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "numpy>=1.26",
  "pypdf>=4.0",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "python-pptx>=0.6.23",
  "extract-msg>=0.48",
  "xlrd>=2.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "xlwt>=1.3"]

[project.scripts]
secondbrain = "secondbrain.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
