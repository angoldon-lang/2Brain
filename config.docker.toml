# Config usata DENTRO il container. I percorsi sono quelli montati da docker-compose.yml.
data_dir = "/data"

[ollama]
host = "http://host.docker.internal:11434"   # Ollama nativo sul Mac (GPU Metal)
chat_model = "qwen2.5:7b-instruct"
embed_model = "bge-m3"

[server]
host = "0.0.0.0"     # solo dentro il container; compose lo pubblica su 127.0.0.1
port = 8765

[[sources]]
name = "Documenti"
type = "folder"
path = "/mnt/documenti"

[[sources]]
name = "OneDrive"
type = "folder"
path = "/mnt/onedrive"

[[sources]]
name = "Outlook archivio"
type = "pst"
path = "/mnt/pst/Archivio.pst"
