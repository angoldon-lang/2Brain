<!doctype html>
<html lang="it"><head><meta charset="utf-8"><title>SecondBrain</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#f4f5f7;--panel:#fff;--fg:#1a1c21;--mut:#6b7280;--line:#e4e6eb;--acc:#4f46e5;--acc2:#eef0ff;--card:#f7f8fa;--hl:#fff1a8;
 --ok:#16a34a;--warn:#d97706;--err:#dc2626;--sh:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08)}
@media(prefers-color-scheme:dark){:root{--bg:#0f1115;--panel:#181b21;--fg:#eceef2;--mut:#98a0ad;--line:#2a2f38;--acc:#818cf8;--acc2:#23264a;--card:#1f232b;--hl:#5a4d00;--sh:none}}
*{box-sizing:border-box}
body{margin:0;font:14.5px/1.5 -apple-system,BlinkMacSystemFont,"Inter",system-ui,sans-serif;background:var(--bg);color:var(--fg);height:100vh;display:flex;flex-direction:column}
/* top bar */
#top{display:flex;align-items:center;gap:14px;padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px;letter-spacing:-.01em}
.logo i{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#6366f1,#a855f7);display:grid;place-items:center;color:#fff;font-style:normal;font-size:15px}
.ver{font-size:11px;font-weight:600;color:var(--acc);background:var(--acc2);padding:2px 8px;border-radius:99px}
nav{display:flex;gap:4px;margin-left:18px}
nav button{background:none;border:0;color:var(--mut);padding:7px 14px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer}
nav button.on{background:var(--acc2);color:var(--acc)}
#pill{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok)}.dot.busy{background:var(--warn);animation:p 1.2s infinite}
@keyframes p{50%{opacity:.35}}
/* layout */
main{flex:1;display:grid;grid-template-columns:minmax(380px,46%) 1fr;gap:14px;padding:14px 20px 20px;min-height:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);min-height:0;display:flex;flex-direction:column;overflow:hidden}
.view{display:none;flex:1;min-height:0;flex-direction:column}.view.on{display:flex}
/* chat */
#log{flex:1;overflow:auto;padding:18px}
.hello{margin:8vh auto 0;max-width:380px;text-align:center;color:var(--mut)}
.hello h2{color:var(--fg);margin:.2em 0}.hello .chips{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.chips button{background:var(--card);border:1px solid var(--line);color:var(--fg);padding:9px 12px;border-radius:10px;font:inherit;cursor:pointer;text-align:left}
.chips button:hover{border-color:var(--acc)}
.q{margin:0 0 10px auto;background:var(--acc);color:#fff;padding:9px 14px;border-radius:14px 14px 4px 14px;max-width:85%;width:fit-content;white-space:pre-wrap}
.a{margin:0 0 6px;white-space:pre-wrap;line-height:1.6}
.cite{color:var(--acc);background:var(--acc2);border-radius:5px;padding:0 5px;font-weight:700;font-size:12.5px;cursor:pointer}
.srcs{margin:8px 0 22px;display:grid;gap:6px}
.srcs h4{margin:4px 0 0;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.src{display:flex;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px;cursor:pointer}
.src:hover,.src.on{border-color:var(--acc);background:var(--acc2)}
.num{flex:none;width:22px;height:22px;border-radius:6px;background:var(--acc);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
.src b{display:block;font-size:13.5px}.src small{display:block;color:var(--mut);word-break:break-all;font-size:12px}
.src p{margin:3px 0 0;color:var(--mut);font-size:12.5px}
form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
input,select{padding:10px 13px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);font:inherit;outline:none}
input:focus{border-color:var(--acc)}form input{flex:1}
button.pri{padding:9px 18px;border:0;border-radius:10px;background:var(--acc);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button.pri:disabled{opacity:.5}
button.ghost{padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg);font:inherit;font-size:13px;cursor:pointer}
button.ghost:hover{border-color:var(--acc)}
/* stato */
#stato{overflow:auto;padding:16px;gap:14px}
.tot{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:var(--card);border-radius:12px;padding:12px 14px}.kpi b{font-size:24px;display:block;letter-spacing:-.02em}.kpi span{font-size:12px;color:var(--mut)}
.sc{border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-top:12px}
.sc header{display:flex;align-items:center;gap:8px}.sc h3{margin:0;font-size:15px}
.badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--card);color:var(--mut)}
.badge.ok{background:#16a34a22;color:var(--ok)}.badge.busy{background:#d9770622;color:var(--warn)}.badge.err{background:#dc262622;color:var(--err)}
.path{font-size:12px;color:var(--mut);word-break:break-all;margin:2px 0 8px}
.bar{height:7px;border-radius:99px;background:var(--card);overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,#6366f1,#a855f7);transition:width .4s}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--mut)}.meta b{color:var(--fg)}
.kinds{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.kinds span{font-size:11.5px;background:var(--card);border-radius:6px;padding:2px 7px}
.iss{margin-top:8px;font-size:12.5px}.iss summary{cursor:pointer;color:var(--warn);font-weight:600}
.iss li{margin:5px 0;color:var(--mut);word-break:break-all}.iss li em{display:block;color:var(--fg);font-style:normal}
.err-t{color:var(--err);font-size:12.5px;margin-top:6px}
.files{margin-top:18px}.files h3{margin:0 0 8px;font-size:14px}
.frow{display:flex;gap:10px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px}
.frow:hover{background:var(--acc2)}.frow .k{flex:none;width:42px;text-align:center;font-size:10.5px;font-weight:700;text-transform:uppercase;background:var(--card);border-radius:5px;padding:2px 0;color:var(--mut)}
.frow .t{flex:1;min-width:0}.frow .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.frow .t small{color:var(--mut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frow .n{color:var(--mut);font-size:12px;flex:none}
/* anteprima */
#pbar{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#pbar .tt{flex:1;min-width:160px}#pbar .tt b{display:block}#pbar .tt small{color:var(--mut);word-break:break-all}
#pbody{flex:1;overflow:auto;min-height:0}#pbody iframe,#pbody img{width:100%;height:100%;border:0;object-fit:contain;background:#fff}
.ch{padding:11px 18px;border-bottom:1px solid var(--line);white-space:pre-wrap;font-size:13px;line-height:1.6}.ch.hit{background:var(--hl);border-left:3px solid var(--warn)}
.empty{padding:60px 30px;color:var(--mut);text-align:center}
.tabs{display:flex;gap:4px;padding:8px 16px 0;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--mut);padding:6px 10px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.tabs button.on{color:var(--acc);border-color:var(--acc)}
.pg{display:flex;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px solid var(--line);font-size:13px;color:var(--mut)}
.doc{padding:18px 22px;white-space:pre-wrap;font-size:13.5px;line-height:1.7;max-width:80ch}
.doc mark{background:var(--hl);color:inherit;border-radius:3px;padding:1px 0;box-shadow:0 0 0 2px var(--hl)}
.load{padding:40px;text-align:center;color:var(--mut)}
#note{display:none;margin:0 12px 8px;padding:8px 12px;border-radius:10px;background:#d9770618;color:var(--warn);font-size:12.5px}
#note.on{display:block}
.runs{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}.runs td,.runs th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left}
.runs th{color:var(--mut);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
@media(max-width:900px){main{grid-template-columns:1fr}#prevcard{display:none}}
</style></head><body>
<div id="top">
 <div class="logo"><i>🧠</i>SecondBrain<span class="ver" id="ver">v…</span></div>
 <nav><button data-v="chat" class="on">Chiedi</button><button data-v="stato">Stato file</button></nav>
 <div id="pill"><span class="dot" id="dot"></span><span id="pt">…</span><button class="ghost" id="re">Reindicizza</button></div>
</div>
<main>
 <section class="card">
  <div class="view on" id="chat">
   <div id="log"><div class="hello"><div style="font-size:34px">🔎</div><h2>Cosa cerchi?</h2>
     Risponde solo dai tuoi documenti e cita sempre dove ha trovato l'informazione. Tutto resta su questo Mac.
     <div class="chips"><button>Qual è l'ultima offerta inviata a Tosano?</button><button>Riassumi la mail su budget e marketing</button><button>Dove si parla di rack e switch?</button></div></div></div>
   <div id="note"></div>
   <form id="f"><input id="q" placeholder="Fai una domanda sui tuoi file e le tue mail…" autofocus><button class="pri" id="go">Invia</button></form>
  </div>
  <div class="view" id="stato"></div>
 </section>
 <section class="card" id="prevcard">
  <div id="pbar"><div class="tt"><b>Anteprima</b></div></div>
  <div id="pbody"><div class="empty">Clicca una fonte o un file<br>per vederne l'anteprima.</div></div>
 </section>
</main>
<script>
const $=s=>document.querySelector(s),log=$('#log');let history=[],S=null,fq='',fsrc='',foff=0;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const ago=t=>{if(!t)return '—';const s=Date.now()/1e3-t;return s<60?'adesso':s<3600?Math.floor(s/60)+' min fa':s<86400?Math.floor(s/3600)+' h fa':new Date(t*1e3).toLocaleDateString('it-IT')};
const paged=k=>['pdf','pptx','xlsx','xls'].includes(k);
const fmt=n=>(n??0).toLocaleString('it-IT');
/* navigazione */
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
 document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id===b.dataset.v));if(b.dataset.v==='stato')renderStato()});
/* stato */
const dur=sec=>{sec=Math.round(sec);if(sec<60)return sec+' s';const m=Math.round(sec/60);return m<60?m+' min':Math.floor(m/60)+' h '+(m%60)+' min'};
function eta(l){if(!l||l.state!=='indexing'||!l.t0||l.processed<20)return '';const el=Date.now()/1e3-l.t0;if(el<20)return '';
 const rate=l.processed/el;return rate>0?'~'+dur((l.total-l.processed)/rate)+' rimanenti':''}
async function status(){S=await (await fetch('/api/status')).json();
 $('#ver').textContent='v'+S.version;const busy=S.indexing.running;
 $('#dot').className='dot'+(busy?' busy':'');
 const cur=S.sources.find(x=>x.name===S.indexing.current),l=cur&&cur.live;
 const pct=l&&l.total?Math.round(100*l.processed/l.total):0;
 $('#pt').textContent=busy?`Indicizzo ${S.indexing.current}${l&&l.total?' · '+pct+'%':'…'}`:`${fmt(S.documents)} documenti · ${S.semantic?'ricerca semantica':'solo parole chiave'}`;
 $('#re').disabled=busy;
 const n=$('#note');if(busy&&l&&l.total){n.classList.add('on');n.textContent=`Indicizzazione in corso (${fmt(l.processed)} di ${fmt(l.total)} file in «${cur.name}»${eta(l)?' · '+eta(l):''}). Puoi già fare domande, ma i risultati possono essere incompleti. I file più recenti vengono indicizzati per primi.`}
 else if(busy){n.classList.add('on');n.textContent='Scansione delle cartelle in corso…'}else n.classList.remove('on');
 if($('#stato').classList.contains('on'))renderStato();
 setTimeout(status,busy?1500:15000)}
$('#re').onclick=async()=>{await fetch('/api/reindex',{method:'POST'});status()};
function sourceCard(s){const l=s.live;let badge='<span class="badge">Non ancora indicizzata</span>',bar='',err='',e='';
 if(l){const pr=l.total?Math.round(100*l.processed/l.total):0;
  if(l.state==='indexing'||l.state==='scanning')badge=`<span class="badge busy">${l.state==='scanning'?'Scansione…':'Indicizzo '+pr+'%'}</span>`,bar=`<div class="bar"><i style="width:${l.state==='scanning'?3:Math.max(pr,1)}%"></i></div>`,e=eta(l);
  else if(l.state==='waiting')badge='<span class="badge">In coda</span>';
  else if(l.state==='error')badge='<span class="badge err">Errore</span>',err=`<div class="err-t">⚠ ${esc(l.error)}</div>`;
  else badge='<span class="badge ok">Aggiornata</span>'}
 else if(s.documents)badge='<span class="badge ok">Indicizzata</span>';
 const kinds=Object.entries(s.kinds).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<span>${esc(k)} <b>${n}</b></span>`).join('');
 const c=el('div','sc',`<header><h3>${esc(s.name)}</h3>${badge}<span style="margin-left:auto" class="badge">${esc(s.type)}</span></header>
  <div class="path">${esc(s.path)}</div>${bar}${err}
  <div class="meta"><span><b>${fmt(s.documents)}</b> file indicizzati</span><span><b>${fmt(s.chunks)}</b> frammenti</span>
   ${l&&l.total?`<span><b>${fmt(l.processed)}</b> / ${fmt(l.total)} esaminati</span>`:''}${e?`<span><b>${e}</b></span>`:''}<span>aggiornata <b>${ago(s.last_indexed)}</b></span></div>
  <div class="kinds">${kinds}</div>`);
 if(s.issues){const d=el('details','iss',`<summary>${fmt(s.issues)} file con avvisi (non indicizzati o parziali) — mostra il motivo</summary><ul><li>caricamento…</li></ul>`);
  d.ontoggle=async()=>{if(!d.open)return;const r=await (await fetch('/api/issues?source='+encodeURIComponent(s.name))).json();
   d.querySelector('ul').innerHTML=r.map(i=>`<li><em>${esc(i.location)}</em>${esc(i.reason)}</li>`).join('')+(r.length>=500?'<li>…(primi 500)</li>':'')};c.append(d)}
 return c}
let built=false;
function renderStato(){const v=$('#stato');if(!S)return;
 if(!built){built=true;v.innerHTML=`<div id="kpis"></div><div id="cards"></div><div class="files"><h3>Storico indicizzazioni</h3><div id="runs"></div></div>
  <div class="files"><h3>File indicizzati</h3><div style="display:flex;gap:8px"><input id="fq" placeholder="Filtra per nome o percorso…" style="flex:1" value="${esc(fq)}">
  <select id="fs"></select></div><div id="fl"></div></div>`;
  let t;$('#fq').oninput=e=>{clearTimeout(t);t=setTimeout(()=>{fq=e.target.value;foff=0;loadFiles()},250)};
  $('#fs').onchange=e=>{fsrc=e.target.value;foff=0;loadFiles()};
  $('#fs').innerHTML='<option value="">Tutte le sorgenti</option>'+S.sources.map(s=>`<option>${esc(s.name)}</option>`).join('');loadFiles();loadRuns()}
 const issues=S.sources.reduce((a,s)=>a+s.issues,0);
 $('#kpis').innerHTML=`<div class="tot"><div class="kpi"><b>${fmt(S.documents)}</b><span>file indicizzati</span></div>
  <div class="kpi"><b>${fmt(S.chunks)}</b><span>frammenti ricercabili</span></div>
  <div class="kpi"><b style="color:${issues?'var(--warn)':'var(--ok)'}">${fmt(issues)}</b><span>file con avvisi</span></div></div>
  <div class="meta" style="margin-top:10px"><span>Modello chat <b>${esc(S.chat_model)}</b></span><span>Embedding <b>${esc(S.embed_model)}</b></span><span>Versione <b>${esc(S.version)}</b></span>
  <span>Anteprima originale <b>${S.office_preview?'disponibile':'non attiva'}</b></span></div>`;
 const cards=$('#cards');if(!cards.querySelector('details[open]')){cards.innerHTML='';S.sources.forEach(s=>cards.append(sourceCard(s)))}
 if(S.indexing.running!==lastRunning){lastRunning=S.indexing.running;loadRuns()}}
let lastRunning=null;
async function loadRuns(){const r=await (await fetch('/api/runs')).json(),b=$('#runs');if(!b)return;
 b.innerHTML=r.length?`<table class="runs"><tr><th>Avvio</th><th>Durata</th><th>Esaminati</th><th>Nuovi</th><th>Avvisi</th><th>Esito</th></tr>`+
  r.map(x=>`<tr><td>${new Date(x.started*1e3).toLocaleString('it-IT',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</td>
  <td>${x.finished?dur(x.finished-x.started):'—'}</td><td>${fmt(x.scanned)}</td><td>${fmt(x.new)}</td><td>${fmt(x.failed)}</td>
  <td><span class="badge ${x.state==='completata'?'ok':x.state==='in corso'?'busy':'err'}" title="${esc(x.note)}">${esc(x.state)}</span></td></tr>`).join('')+'</table>':'<div class="meta">Nessuna indicizzazione ancora eseguita.</div>'}
async function loadFiles(append){const p=new URLSearchParams({limit:40,offset:foff});if(fq)p.set('q',fq);if(fsrc)p.set('source',fsrc);
 const r=await (await fetch('/api/documents?'+p)).json(),box=$('#fl');if(!append)box.innerHTML='';box.querySelector('.more')?.remove();
 r.items.forEach(d=>{const row=el('div','frow',`<span class="k">${esc(d.kind)}</span><div class="t"><b>${esc(d.title)}</b><small>${esc(d.location)}</small></div><span class="n">${d.chunks} fr. · ${ago(d.indexed_at)}</span>`);
  row.onclick=()=>preview({doc_id:d.id,chunk_id:-1});box.append(row)});
 if(!r.items.length&&!append)box.append(el('div','empty','Nessun file trovato.'));
 if(foff+r.items.length<r.total){const m=el('button','ghost more',`Mostra altri (${r.total-foff-r.items.length})`);m.style.margin='10px 0';m.onclick=()=>{foff+=40;loadFiles(true)};box.append(m)}}
/* anteprima */
const OFFICE=['docx','xlsx','xls','pptx'],PAGEWORD={pdf:'Pagina',pptx:'Slide',xlsx:'Foglio',xls:'Foglio'};let cur=null;
async function preview(h,card){document.querySelectorAll('.src.on').forEach(x=>x.classList.remove('on'));card&&card.classList.add('on');
 const d=await (await fetch('/api/doc/'+h.doc_id)).json();
 cur={h,d,mode:d.kind==='pdf'?'orig':'text',page:h.page||null};drawPreview()}
function hasOrig(d){return d.kind==='pdf'||(S&&S.office_preview&&OFFICE.includes(d.kind))}
async function drawPreview(){const {h,d}=cur,b=$('#pbody'),bar=$('#pbar');
 bar.innerHTML=`<div class="tt"><b>${esc(d.title)}</b><small>${esc(d.location)}</small></div>
  <button class="ghost" onclick="window.open('/api/file/${d.id}')">Apri</button><button class="ghost" onclick="fetch('/api/reveal/${d.id}',{method:'POST'})">Mostra nel Finder</button>`;
 let tabs=$('#ptabs');if(!tabs){tabs=el('div','tabs');tabs.id='ptabs';bar.parentNode.insertBefore(tabs,b)}
 tabs.innerHTML=hasOrig(d)&&d.kind!=='pdf'?`<button data-m="text" class="${cur.mode==='text'?'on':''}">Testo trovato</button><button data-m="orig" class="${cur.mode==='orig'?'on':''}">Documento originale</button>`:'';
 tabs.style.display=tabs.innerHTML?'flex':'none';
 tabs.querySelectorAll('button').forEach(t=>t.onclick=()=>{cur.mode=t.dataset.m;drawPreview()});
 const term=encodeURIComponent((h.text||'').split(/\s+/).slice(0,4).join(' '));
 if(cur.mode==='orig'){b.innerHTML='';
  if(d.kind==='pdf'){const i=el('iframe');i.src=`/api/file/${d.id}#page=${cur.page||1}${term?'&search='+term:''}`;b.append(i);return}
  if(['png','jpg','jpeg','gif'].includes(d.kind)){const i=el('img');i.src='/api/file/'+d.id;b.append(i);return}
  const ld=el('div','load','Preparo l’anteprima del documento… (la prima volta richiede qualche secondo)');b.append(ld);
  const mine=cur;
  try{const r=await fetch('/api/pdf/'+d.id);if(!r.ok)throw new Error((await r.json()).detail||r.status);await r.arrayBuffer()}
  catch(e){if(cur===mine)b.innerHTML='<div class="empty">Anteprima originale non disponibile: '+esc(e.message)+'</div>';return}
  if(cur!==mine||cur.mode!=='orig')return;     // nel frattempo l’utente ha cambiato scheda/documento
  b.innerHTML='';const i=el('iframe');i.src=`/api/pdf/${d.id}${term?'#search='+term:''}`;b.append(i);return}
 const q=new URLSearchParams();if(h.chunk_id>0)q.set('chunk',h.chunk_id);if(cur.page)q.set('page',cur.page);
 b.innerHTML='<div class="load">Carico…</div>';
 const r=await fetch(`/api/preview/${d.id}?${q}`);
 if(!r.ok){b.innerHTML='<div class="empty">'+esc((await r.json()).detail||'Anteprima non disponibile')+'</div>';return}
 const v=await r.json();cur.page=v.page;b.innerHTML='';
 if(v.pages.length>1){const i=v.pages.indexOf(v.page),w=PAGEWORD[d.kind]||'Parte';

async function ask(q){if(!q)return;$('#q').value='';$('#go').disabled=true;log.querySelector('.hello')?.remove();
 log.append(el('div','q',esc(q)));const ans=el('div','a','<span style="color:var(--mut)">Cerco nei documenti…</span>'),box=el('div','srcs');log.append(ans,box);
