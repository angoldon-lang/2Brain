<!doctype html>
<html lang="it"><head><meta charset="utf-8"><title>SecondBrain</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#fff;--fg:#1d1d1f;--mut:#6e6e73;--line:#e5e5ea;--acc:#0a66d9;--card:#f5f5f7;--hl:#fff3b0}
@media(prefers-color-scheme:dark){:root{--bg:#1c1c1e;--fg:#f2f2f7;--mut:#98989d;--line:#3a3a3c;--acc:#4da3ff;--card:#2c2c2e;--hl:#5a4d00}}
*{box-sizing:border-box}body{margin:0;font:15px -apple-system,system-ui,sans-serif;background:var(--bg);color:var(--fg);height:100vh;display:grid;grid-template-columns:minmax(380px,1fr) 1fr}
#chat{display:flex;flex-direction:column;border-right:1px solid var(--line);min-height:0}
header{padding:10px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;font-size:13px;color:var(--mut)}
header b{color:var(--fg)}header button{margin-left:auto}
#log{flex:1;overflow:auto;padding:16px}
.msg{margin:0 0 18px;white-space:pre-wrap;line-height:1.5}.q{font-weight:600}
.src{background:var(--card);border-radius:8px;padding:8px 10px;margin:6px 0;cursor:pointer;font-size:13px;white-space:normal}
.src:hover,.src.on{outline:2px solid var(--acc)}.src small{color:var(--mut);display:block;word-break:break-all}
.src p{margin:4px 0 0;color:var(--mut)}
.cite{color:var(--acc);cursor:pointer;font-weight:600}
form{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
input{flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
button{padding:8px 14px;border:0;border-radius:8px;background:var(--acc);color:#fff;font:inherit;cursor:pointer}
button.ghost{background:var(--card);color:var(--fg)}
#prev{display:flex;flex-direction:column;min-height:0}#pbar{padding:10px 16px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#pbar span{flex:1;min-width:140px;font-size:13px;word-break:break-all}
#pbody{flex:1;overflow:auto;min-height:0}#pbody iframe,#pbody img{width:100%;height:100%;border:0;object-fit:contain}
.ch{padding:10px 16px;border-bottom:1px solid var(--line);white-space:pre-wrap;font-size:13px;line-height:1.5}.ch.hit{background:var(--hl)}
.empty{padding:40px;color:var(--mut);text-align:center}
@media(max-width:800px){body{grid-template-columns:1fr}#prev{display:none}}
</style></head><body>
<section id="chat">
 <header><b>SecondBrain</b><span id="st">…</span><button class="ghost" id="re">Reindicizza</button></header>
 <div id="log"><div class="empty">Chiedi qualcosa sui tuoi documenti, mail o file.<br>Tutto resta su questo Mac.</div></div>
 <form id="f"><input id="q" placeholder="Es. Qual è l'ultima offerta inviata a Rossi?" autofocus><button>Invia</button></form>
</section>
<section id="prev"><div id="pbar"><span id="ptitle">Anteprima</span></div><div id="pbody"><div class="empty">Clicca una fonte per vedere l'anteprima.</div></div></section>
<script>
const $=s=>document.querySelector(s),log=$('#log');let history=[];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function el(t,c,h){const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e}
async function status(){const s=await (await fetch('/api/status')).json();
 $('#st').textContent=`${s.documents} doc · ${s.chunks} frammenti · ${s.semantic?'ricerca semantica':'solo parole chiave'}${s.indexing.running?' · indicizzo '+s.indexing.source+' ('+s.indexing.done+')':''}`;
 if(s.indexing.running)setTimeout(status,2000)}
$('#re').onclick=async()=>{await fetch('/api/reindex',{method:'POST'});status()};
async function preview(h,card){
 document.querySelectorAll('.src.on').forEach(x=>x.classList.remove('on'));card&&card.classList.add('on');
 const d=await (await fetch('/api/doc/'+h.doc_id)).json(),b=$('#pbody');
 $('#pbar').innerHTML=`<span><b>${esc(d.title)}</b><br><small>${esc(d.location)}${h.page?' · pag. '+h.page:''}</small></span>
  <button class="ghost" onclick="window.open('/api/file/${d.id}')">Apri</button><button class="ghost" onclick="fetch('/api/reveal/${d.id}',{method:'POST'})">Mostra nel Finder</button>`;
 b.innerHTML='';
 if(d.kind==='pdf')b.append(el('iframe',null)),b.firstChild.src=`/api/file/${d.id}#page=${h.page||1}`;
 else if(['png','jpg','jpeg','gif'].includes(d.kind))b.append(el('img')),b.firstChild.src='/api/file/'+d.id;
 else{d.chunks.forEach(c=>{const x=el('div','ch'+(c.id===h.chunk_id?' hit':''));x.textContent=c.text;b.append(x)});
  const hit=b.querySelector('.hit');hit&&hit.scrollIntoView({block:'center'})}}
function srcCard(h,i){const c=el('div','src',`<b>[${i}] ${esc(h.title)}</b><small>${esc(h.location)}${h.page&&h.kind!=='eml'?' · pag. '+h.page:''}</small><p>${esc(h.text.slice(0,200))}…</p>`);c.onclick=()=>preview(h,c);return c}
$('#f').onsubmit=async e=>{e.preventDefault();const q=$('#q').value.trim();if(!q)return;$('#q').value='';
 log.querySelector('.empty')?.remove();log.append(el('div','msg q',esc(q)));
 const ans=el('div','msg');const box=el('div');log.append(ans,box);let hits=[],txt='';
 const r=await fetch('/api/ask',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({question:q,history})});
 const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
 const render=()=>{ans.innerHTML=esc(txt).replace(/\[(\d+)\]/g,(m,n)=>`<span class="cite" data-n="${n}">[${n}]</span>`);
  ans.querySelectorAll('.cite').forEach(c=>c.onclick=()=>{const h=hits[c.dataset.n-1];h&&preview(h,box.children[c.dataset.n-1])});log.scrollTop=log.scrollHeight};
 for(;;){const{done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});
  const parts=buf.split('\n\n');buf=parts.pop();
  for(const p of parts){const j=p.replace(/^data: /,'');if(j==='[DONE]')continue;const m=JSON.parse(j);
   if(m.sources){hits=m.sources;hits.forEach((h,i)=>box.append(srcCard(h,i+1)));hits[0]&&preview(hits[0],box.firstChild)}
   if(m.token){txt+=m.token;render()}if(m.error){txt+='\n⚠ '+m.error;render()}}}
 history.push({role:'user',content:q},{role:'assistant',content:txt})};
status();
</script></body></html>
