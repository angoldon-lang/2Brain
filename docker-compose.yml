services:
  secondbrain:
    build: .
    ports: ["127.0.0.1:8765:8765"]          # raggiungibile solo dal Mac
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ./config.docker.toml:/app/config.docker.toml:ro
      - sb-data:/data                        # indice + cache PST (unica parte scrivibile)
      # Sorgenti: SEMPRE in sola lettura. Adatta i percorsi a sinistra.
      - ${HOME}/Documents:/mnt/documenti:ro
      - ${HOME}/Library/CloudStorage/OneDrive-NOMEAZIENDA:/mnt/onedrive:ro
      - ${HOME}/Documents/Archivio.pst:/mnt/pst/Archivio.pst:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
volumes:
  sb-data:
